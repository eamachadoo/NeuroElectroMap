<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroElectroMap — Interactive Atlas Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ───── theme variables ───── */
    :root[data-theme="light"] {
      --bg:#f1f4f8; --surface:#ffffff; --surface-2:#f7f9fc;
      --border:#e2e7ee; --border-2:#eef1f5;
      --ink:#1b2530; --ink-2:#475263; --muted:#7a8696;
      --accent:#2563a8; --elec:#d6342b;
      --stage-grad: radial-gradient(120% 120% at 50% 38%, #ffffff 0%, #eef2f7 60%, #e7ecf3 100%);
      --shadow-1: 0 1px 0 rgba(27,37,48,.02);
      --shadow-2: 0 12px 30px rgba(27,37,48,.16);
      --shadow-3: 0 6px 18px rgba(27,37,48,.07);
    }
    :root[data-theme="dark"] {
      --bg:#0d1117; --surface:#161c24; --surface-2:#1d242e;
      --border:#2a3340; --border-2:#232b35;
      --ink:#e8ecf2; --ink-2:#b6c0cc; --muted:#7a8696;
      --accent:#5da7e6; --elec:#ff7665;
      --stage-grad: radial-gradient(120% 120% at 50% 38%, #1a212c 0%, #121821 60%, #0c1219 100%);
      --shadow-1: 0 1px 0 rgba(0,0,0,.3);
      --shadow-2: 0 12px 30px rgba(0,0,0,.55);
      --shadow-3: 0 6px 18px rgba(0,0,0,.35);
    }

    /* ───── reset ───── */
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
      -webkit-font-smoothing: antialiased; overflow: hidden;
      transition: background .2s, color .2s;
    }
    #root { height: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    /* ───── app shell ───── */
    .app { height: 100%; display: flex; flex-direction: column; }

    .topbar {
      height: 60px; flex: none;
      display: flex; align-items: center; gap: 22px;
      padding: 0 22px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-1);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-name { font-size: 16px; font-weight: 500; letter-spacing: -.01em; }
    .brand-name b { font-weight: 700; }
    .casebar {
      display: flex; align-items: center; gap: 12px;
      padding-left: 22px; border-left: 1px solid var(--border);
    }
    .casebar-id {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12.5px; font-weight: 500; color: var(--ink);
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px; letter-spacing: .02em;
    }
    .caseselect {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12.5px; font-weight: 500; color: var(--ink);
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 28px 7px 10px; letter-spacing: .02em;
      cursor: pointer; appearance: none; -webkit-appearance: none;
      /* Inline chevron — adapts to ink colour via currentColor */
      background-image:
        linear-gradient(45deg, transparent 50%, currentColor 50%),
        linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position:
        calc(100% - 14px) 53%,
        calc(100% - 9px)  53%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .caseselect:hover { border-color: var(--accent); }
    .caseselect:focus { outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .casenote { font-size: 12.5px; color: var(--muted); }
    .topright { margin-left: auto; display: flex; align-items: center; gap: 12px; }

    /* segmented toggle (2D/3D) */
    .segtoggle {
      display: inline-flex; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 9px; padding: 2px;
    }
    .segtoggle button {
      font-size: 12px; font-weight: 600; letter-spacing: .02em;
      color: var(--muted); padding: 6px 12px; border-radius: 7px;
      transition: background .15s, color .15s;
    }
    .segtoggle button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

    .iconbtn {
      width: 34px; height: 34px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--ink-2); transition: background .15s, color .15s;
    }
    .iconbtn:hover { color: var(--ink); }

    /* ───── body ───── */
    .body { flex: 1; display: flex; min-height: 0; position: relative; }
    .stage {
      flex: 1; position: relative;
      display: flex; align-items: center; justify-content: center;
      padding: 36px; min-width: 0;
      background: var(--stage-grad);
    }
    .brainwrap { position: relative; width: 100%; max-width: 780px; height: 100%;
      display: flex; align-items: center; justify-content: center; }
    .brainwrap-placeholder {
      border: 1px dashed var(--border); border-radius: 14px;
      background: var(--surface-2); color: var(--muted);
    }
    .placeholder-msg { text-align: center; padding: 30px; }
    .placeholder-title { font-size: 15px; font-weight: 600; color: var(--ink-2); }
    .placeholder-sub { font-size: 12.5px; margin-top: 6px; }

    /* 3D Plotly container */
    .brain3dwrap {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column;
    }
    .brain3dplot { flex: 1; min-height: 0; min-width: 0; width: 100%; }
    .brain3dwrap .braincount { align-self: center; max-width: 580px; }
    .brain3d-spinner {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 12.5px; pointer-events: none;
    }

    /* 2D brain SVG */
    .brainwrap { flex-direction: column; max-width: 820px; }
    .brainsvg { width: 100%; height: auto; max-height: 100%; display: block; overflow: visible; }
    .brainsvg .pool-divider { fill: var(--border); }
    .brainsvg .pool-eyebrow {
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 10.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      fill: var(--muted); pointer-events: none;
    }
    .brainsvg .pool-laneTitle {
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 10.5px; font-weight: 600;
      fill: var(--ink-2); pointer-events: none;
    }
    .brainsvg .pool-laneCount {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10.5px; fill: var(--muted); pointer-events: none;
    }
    .braincount {
      margin-top: 10px; font-size: 11.5px; color: var(--muted);
      text-align: center; max-width: 580px;
    }
    .braincount strong { color: var(--ink-2); font-weight: 600; }
    .brainsvg .rlabel {
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 11px; font-weight: 600; fill: var(--ink);
      paint-order: stroke; stroke: var(--surface);
      stroke-width: 3px; stroke-linejoin: round;
      pointer-events: none;
    }

    /* brain tooltip */
    .braintip {
      position: absolute; z-index: 30; pointer-events: none;
      background: var(--surface); color: var(--ink);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 12px; box-shadow: var(--shadow-2);
      min-width: 160px; max-width: 240px;
    }
    .braintip-name { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
    .braintip-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .braintip-meta {
      display: flex; align-items: center; gap: 6px;
      font-size: 11.5px; color: var(--ink-2); margin-top: 6px; font-weight: 500;
    }
    .braintip-meta .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .braintip-bas {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;
    }
    .braintip-bachip {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10.5px; padding: 2px 6px; border-radius: 4px;
      background: var(--surface-2); color: var(--ink-2); font-weight: 500;
    }

    /* legend */
    .legend {
      position: absolute; left: 24px; bottom: 22px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: var(--shadow-3);
      max-width: 330px; max-height: 50%; overflow-y: auto;
      transition: padding .15s, max-height .2s;
    }
    .legend.expanded { padding: 12px 13px; }
    .legend.collapsed { padding: 0; max-height: 36px; overflow: hidden; }
    .legend-head {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px;
      cursor: pointer; user-select: none;
      font-size: 10.5px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted);
      border-radius: 12px;
      transition: background .12s, color .12s;
    }
    .legend-head:hover { color: var(--ink-2); background: var(--surface-2); }
    .legend.expanded .legend-head { padding: 0 0 8px 0; background: transparent; }
    .legend-caret {
      margin-left: auto; transition: transform .2s;
      font-size: 11px; color: var(--muted);
    }
    .legend.expanded .legend-caret { transform: rotate(180deg); }
    .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; }
    .leg {
      display: flex; align-items: center; gap: 7px;
      padding: 3px 4px; border-radius: 6px;
      font-size: 11.5px; color: var(--ink-2);
      text-align: left; transition: background .12s;
    }
    .leg:hover, .leg.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); }
    .leg-dot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
    .leg-l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .clearsel {
      position: absolute; right: 24px; top: 22px;
      font-size: 12px; font-weight: 500; color: var(--ink-2);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px; box-shadow: var(--shadow-3);
      white-space: nowrap;
    }
    .clearsel:hover { color: var(--ink); }

    /* side panel */
    .panel {
      width: 384px; flex: none;
      background: var(--surface); border-left: 1px solid var(--border);
      overflow-y: auto;
    }
    .pbody { padding: 22px 22px 28px; }
    .p-eyebrow {
      font-size: 10.5px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--accent);
    }
    .p-title { font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin: 5px 0 0; }
    .p-lead { font-size: 13px; line-height: 1.5; color: var(--ink-2); margin: 10px 0 0; }
    .p-sec {
      font-size: 10.5px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted); margin: 22px 0 10px;
    }
    .p-note { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin: 9px 0 0; }

    .crumb {
      font-size: 12px; font-weight: 500; color: var(--accent);
      padding: 2px 0; margin-bottom: 14px;
    }
    .crumb:hover { text-decoration: underline; }

    /* stats row */
    .statrow {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 9px; margin-top: 18px;
    }
    .stat {
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 11px 12px;
    }
    .stat-n {
      font-size: 22px; font-weight: 600;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: -.02em; color: var(--ink);
    }
    .stat-l { font-size: 10.5px; color: var(--muted); margin-top: 2px; font-weight: 500; }

    /* region list (overview) */
    .rlist, .elist { display: flex; flex-direction: column; gap: 2px; }
    .rrow {
      display: grid; grid-template-columns: 14px 1fr auto 26px 12px;
      align-items: center; gap: 11px; padding: 9px 8px;
      border-radius: 9px; text-align: left; transition: background .12s;
      width: 100%;
    }
    .rrow:hover { background: var(--surface-2); }
    .rrow.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .rrow-dot { width: 12px; height: 12px; border-radius: 4px; }
    .rrow-name { font-size: 13px; font-weight: 500; color: var(--ink); }
    .rrow-grp { font-size: 10.5px; color: var(--muted); }
    .rrow-n {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px; color: var(--ink-2); font-weight: 500;
    }
    .chev { color: var(--muted); font-size: 16px; text-align: right; }

    /* region detail header */
    .rd-head { display: flex; align-items: center; gap: 13px; margin-top: 2px; }
    .rd-head > div { min-width: 0; }
    .rd-chip { width: 38px; height: 38px; border-radius: 10px; flex: none; }

    /* electrode list (inside region detail) */
    .erow {
      display: grid; grid-template-columns: 52px 1fr auto 12px;
      align-items: center; gap: 10px; padding: 9px 8px;
      border-radius: 9px; text-align: left; transition: background .12s;
      width: 100%;
    }
    .erow:hover { background: var(--surface-2); }
    .erow.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .erow-id {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12.5px; font-weight: 600; color: var(--ink);
    }
    .erow-anat {
      font-size: 11.5px; color: var(--ink-2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .erow-shift {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11.5px; color: var(--muted);
    }

    /* electrode detail header */
    .ed-head { display: flex; align-items: center; gap: 13px; margin-top: 2px; }
    .ed-head > div { min-width: 0; }
    .ed-head .p-title { white-space: nowrap; }
    .ed-badge {
      width: 52px; height: 42px; border-radius: 10px; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 600; font-size: 13px;
      background: color-mix(in srgb, var(--elec) 14%, transparent);
      color: var(--elec);
      border: 1px solid color-mix(in srgb, var(--elec) 28%, transparent);
    }
    .reglink {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12.5px; color: var(--ink-2); margin-top: 4px; font-weight: 500;
    }
    .reglink-dot { width: 12px; height: 12px; border-radius: 4px; }
    .reglink:hover { color: var(--accent); }

    /* attribute grid */
    .attrgrid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 9px; margin-top: 18px;
    }
    .attr {
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 11px 12px;
    }
    .attr-k { font-size: 10.5px; color: var(--muted); font-weight: 500; }
    .attr-v {
      font-size: 13.5px; font-weight: 600; margin-top: 3px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: -.01em; color: var(--ink);
    }
    .attr-wide { grid-column: 1 / -1; }

    /* error state */
    .errscreen {
      height: 100%; display: flex; align-items: center; justify-content: center;
      padding: 40px;
    }
    .errcard {
      max-width: 540px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px 30px; box-shadow: var(--shadow-3);
    }
    .errcard h1 { font-size: 18px; margin: 0 0 8px; }
    .errcard p { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
    .errcard code {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12.5px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 5px;
      padding: 1px 6px; color: var(--ink);
    }

    @media (max-width: 1100px) {
      .panel { width: 340px; }
      .casenote { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Plotly + Babel from CDN -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Patient data (generated by scripts/export_for_viewer.py).
       Two layouts are supported:
         · multi-patient (preferred): manifest.js declares window.NEM_MANIFEST,
           the app then fetches outputs/viewer/<id>/data.json for the selected
           case
         · legacy single-patient: outputs/viewer/data.js sets window.NEM_DATA
           directly (used when no manifest is present yet)
       Both scripts are loaded with `onerror="void 0"` so the page still works
       if one of them is missing. -->
  <script src="../outputs/viewer/manifest.js" onerror="void 0"></script>
  <script src="../outputs/viewer/data.js"     onerror="void 0"></script>

  <!-- Static metadata + components. Cache-busting query string is bumped when
       any of these files change during development — also see scripts/dev_server.py
       which sends no-cache headers. -->
  <script src="regions.js?v=4"></script>
  <script type="text/babel" src="panel.jsx?v=4"></script>
  <script type="text/babel" src="brain2d.jsx?v=4"></script>
  <script type="text/babel" src="brain3d.jsx?v=4"></script>
  <script type="text/babel" src="app.jsx?v=4"></script>
</body>
</html>
